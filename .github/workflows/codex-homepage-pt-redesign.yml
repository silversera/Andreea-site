              text = text.replace('</style>', css + '\n</style>')

          hero_start = text.index('<section class="hero">')
          schedule_start = text.index('<section id="schedule">')
          text = text[:hero_start] + new_top + text[schedule_start:]

          if text.count('<section id="pricing">') != 1:
              raise SystemExit('Expected exactly one pricing section after rewrite')
          required = [
              'Personal Training &amp; Pilates Coaching in Portlaoise',
              '&ldquo;Train with control, move with rhythm.&rdquo;',
              'New Client Intro Session',
              '1:1 Private Training',
              '2-Person Semi-Private Training',
              'Small Group Personal Training (3 people)',
              '1:1 Online Personal Training',
              'Who This Is For',
              'Supporting Classes &amp; Services',
              'Home-training gear provided where needed',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'Missing required content: {needle}')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit redesign and remove temporary workflow
